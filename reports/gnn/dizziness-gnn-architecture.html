ct.","Q 259376\u003cbr\u003eIf you have fallen, how many falls have you had in the past year?","Q 259377\u003cbr\u003eIf you have fallen, were you injured?","Q 259380\u003cbr\u003eWhy do you think you fell?","Q 259381\u003cbr\u003eDo you experience any of the following? Choose all that apply.","Q 259382\u003cbr\u003eDo you currently have or have you been ever diagnosed with any of these conditions? Please choose all that apply.","Q 259383\u003cbr\u003eHave you had a total of 5 or more headaches (no matter how severe) in your lifetime?","Q 259384\u003cbr\u003eHave you ever had a headache that was bad enough to make you stop what you were doing and sit or lie down?","Q 259385\u003cbr\u003eHave you ever had a temporary change in your vision, such as jagged lines, color spots or \"lightning bolts\"?","Q 259386\u003cbr\u003eHave you ever been diagnosed with migraine headaches?","Q 259387\u003cbr\u003eHave headaches been a significant problem for you within the past 6 months?","Q 259388\u003cbr\u003eIf you have experienced headaches in your lifetime, how would you describe them?","Q 259389\u003cbr\u003ePlease check all of the following that you have experienced.","Q 259400\u003cbr\u003eDo you have trouble hearing?","Q 259415\u003cbr\u003eHave you ever had a hearing test that showed that you had a hearing loss?","Q 259416\u003cbr\u003eI have a roaring or ringing in one ear only before or during a dizziness attack?","Q 259417\u003cbr\u003eMy hearing gets worse in one ear before or during a dizziness attack","Q 259418\u003cbr\u003eI have a feeling of fullness or pressure in one ear before or during a dizziness attack","Q 259421\u003cbr\u003eDo you \"hear\" your eyes move?","Q 259422\u003cbr\u003eHave you ever had surgery on your ears as an adult?","Q 259423\u003cbr\u003eIf yes, please explain\u002fspecify the type of ear surgery that was performed and the date:","Q 259424\u003cbr\u003eHave you undergone Magnetic Resonance Imaging (MRI) or CT scan of your head that was abnorm
